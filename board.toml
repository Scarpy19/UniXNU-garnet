schema_version = 2

[board]
# Keep this guard until board inputs and all validation gates are complete.
example = true
name = "garnet"
soc = "SM7435"
soc_source = "sm7435"
# Research target only; neither the kernel nor iOS boot is verified on garnet.
os_profile = "ipados-17.7.11-21H461"
description = "Preliminary garnet bring-up; not bootable"
kit = "garnet"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "garnet_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm7435.config", "os:configs/ipados.config"]
# The SM7435 SMP series targets a different XNU baseline and does not apply
# to this profile. Single-CPU bring-up must not imply SMP support.
patch_series = ["arch:patches/xnu/series", "device:patches/xnu/os17.series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/garnet.dts"
include_dirs = ["soc:dts"]

# Preliminary source-derived paths only. The UEFI patch, vendor inputs,
# memory layout, logging and build defines still need review and verification.
[firmware]
config = "garnet"
dsc = "Platforms/Xiaomi/garnetPkg/garnet.dsc"
fd = "Build/garnetPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
defines = { ENABLE_SECUREBOOT = "0", UNIXNU_GARNET_FALLBACK_INITRD_BASE = "0xA8000000", UNIXNU_GARNET_FALLBACK_INITRD_SIZE = "0x0C000000" }
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[payload]
kernel_args = ["-v", "cpus=1", "serial=3", "debug=0x14e", "boot-progress=2"]
tools = true

# The boot-image DTB must be the garnet DTB used by the functional
# JosephMontfort HakiOS/Mu-Silicium port. The board DTS remains the simplified
# UniXNU ADT source because UniXNU's ADT handoff currently requires one
# contiguous memory range. Copy the reference DTB into build/garnet before
# running `unixnu bootimg`; it is a local, non-repository input.
[bootimg]
dtb = "build/garnet/hakios-garnet.dtb"

# Android boot image header v0 with explicit load addresses.
#
# Header v4 carries no load addresses, and the bootloader then either did not
# load the 192 MiB payload or placed it where the firmware could not find it.
# v0 puts kernel_addr, ramdisk_addr and tags_addr in the header.  The test on
# 2026-11-12 still did not find a FAT volume, and the bootloader reported an
# initrd at 0xABFFF000-0xB7FFF000: it end-aligned the ramdisk to the top of
# the 0xA8000000 "Kernel" window instead of honouring ramdisk_addr.  Keep the
# header convention for further delivery experiments; it is not a fix.
#
#   0x80000000  garnet DRAM base (garnet.dsc PcdSystemMemoryBase)
#   0x28000000  ramdisk_offset -> 0xA8000000
#   0x1E00000   tags_offset    -> 0x81E00000
[bootimg.image]
header_version  = 0
base            = 0x80000000
kernel_offset   = 0x8000
ramdisk_offset  = 0x28000000
tags_offset     = 0x1E00000
pagesize        = 4096
